; Copy into the WLED source folder. Assumes this repo sits next to it:
;   <folder>/WLED-src      (WLED clone)
;   <folder>/wled-matrix   (this repo)
[platformio]
default_envs = nodemcuv2_weather

[env:nodemcuv2_weather]
extends = env:nodemcuv2
custom_usermods =
  user_fx
  matrix_fx = symlink://../wled-matrix/firmware/matrix_fx
