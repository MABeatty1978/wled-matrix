# Home Assistant package: WLED Tempest Weather Matrix (8x32) at 192.168.87.80
#
# Install: copy to /config/packages/ and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
#
# Replace the entity IDs below with your actual Tempest & Home Assistant entity names:
#   - weather.home (or weather.tempest_...)
#   - sensor.tempest_temperature
#   - sensor.tempest_humidity
#   - sensor.tempest_wind_speed
#   - sensor.tempest_wind_direction_cardinal (or degrees)
#   - sensor.tempest_precipitation_rate (in/hr)
#   - sensor.tempest_lightning_strike_distance (miles)
#
# This package also provides the pieces scoreboard_wled.yaml relies on:
# rest_command.wled_matrix_show, the effect ID sensors and script.wled_matrix_weather.
# While a game is on the scoreboard, weather updates pause.

rest_command:
  # Sets the effect and Segment Name text of segment 0 in one request
  wled_matrix_show:
    url: "http://192.168.87.80/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"seg":[{"id":0,"fx":{{ fx | int }},"n":{{ name | string | to_json }}}]}'

# Custom effect IDs are assigned when the firmware boots, so look them up by name
rest:
  - resource: "http://192.168.87.80/json/effects"
    scan_interval: 3600
    sensor:
      - name: "WLED Matrix Tempest FX ID"
        unique_id: wled_matrix_tempest_fx_id
        value_template: "{{ value_json.index('Tempest Weather') if 'Tempest Weather' in value_json else 'unknown' }}"
      - name: "WLED Matrix Scoreboard FX ID"
        unique_id: wled_matrix_scoreboard_fx_id
        value_template: "{{ value_json.index('Scoreboard') if 'Scoreboard' in value_json else 'unknown' }}"

script:
  wled_matrix_weather:
    alias: "WLED Matrix - Show Weather"
    mode: restart
    fields:
      strike:
        description: "True when a nearby lightning strike triggered this update"
        example: false
    sequence:
      # Hold off while the scoreboard owns the matrix
      - condition: template
        value_template: >-
          {{ states('sensor.wled_scoreboard') in ['off', 'unknown', 'unavailable']
             and is_number(states('sensor.wled_matrix_tempest_fx_id')) }}
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: fc
        continue_on_error: true
      - variables:
          daily: "{{ fc['weather.home'].forecast if fc is defined and 'weather.home' in fc else [] }}"

          # 1. Current Temperature, High/Low, and Humidity
          temp_now: "{{ states('sensor.tempest_temperature') | float(60) | round(0) | int }}"
          temp_high: "{{ (daily[0].temperature if daily else temp_now + 5) | round(0) | int }}"
          temp_low: "{{ (daily[0].templow if daily and daily[0].templow is defined else temp_now - 8) | round(0) | int }}"
          humidity: "{{ states('sensor.tempest_humidity') | float(50) | round(0) | int }}"

          # 2. Wind Direction (N, NE, E, SE, S, SW, W, NW) & Speed (mph)
          wind_mph: "{{ states('sensor.tempest_wind_speed') | float(0) | round(0) | int }}"
          wind_dir: "{{ states('sensor.tempest_wind_direction_cardinal') if states('sensor.tempest_wind_direction_cardinal') not in ['unknown', 'unavailable'] else 'NW' }}"

          # 3. Tempest Rain Intensity Level (1=Drizzle .. 5=Downpour)
          rain_rate: "{{ states('sensor.tempest_precipitation_rate') | float(0) }}"
          rain_lvl: >-
            {% if rain_rate < 0.05 %}1
            {% elif rain_rate < 0.15 %}2
            {% elif rain_rate < 0.35 %}3
            {% elif rain_rate < 1.00 %}4
            {% else %}5{% endif %}

          # 4. Map Home Assistant / Tempest Weather Condition to Effect Prefix
          ha_cond: "{{ states('weather.home') }}"
          cond_prefix: >-
            {% if rain_rate > 0 and ha_cond not in ['lightning', 'lightning-rainy', 'snowy'] %}RAIN{{ rain_lvl }}
            {% elif ha_cond in ['lightning', 'lightning-rainy'] %}STORM{{ rain_lvl }}
            {% elif ha_cond in ['pouring'] %}RAIN5
            {% elif ha_cond in ['rainy'] %}RAIN{{ rain_lvl }}
            {% elif ha_cond in ['snowy', 'snowy-rainy', 'hail'] %}SNOW{{ rain_lvl }}
            {% elif ha_cond in ['partlycloudy'] %}PCLOUD
            {% elif ha_cond in ['cloudy', 'fog'] %}CLOUD
            {% elif ha_cond in ['windy', 'windy-variant'] %}WIND
            {% elif ha_cond in ['clear-night'] %}NIGHT
            {% else %}SUN{% endif %}

          # 5. Real-time Lightning Strike <= 10 miles: "BOLT:<miles> <nonce>|" (the nonce makes repeat strikes re-trigger)
          strike_dist: "{{ states('sensor.tempest_lightning_strike_distance') | float(99) | round(0) | int }}"
          bolt_prefix: "{{ 'BOLT:' ~ strike_dist ~ ' ' ~ now().second ~ '|' if strike | default(false) and strike_dist <= 10 else '' }}"

          # Final Segment Name payload (e.g. "RAIN3:56*F|63/48|NW 14|H 72%").
          # The ESP8266 keeps only 32 characters, so trailing pages are dropped when they won't fit.
          pages: "{{ [cond_prefix ~ ':' ~ temp_now ~ '*F', temp_high ~ '/' ~ temp_low, wind_dir ~ ' ' ~ wind_mph, 'H ' ~ humidity ~ '%'] }}"
          wled_text: >-
            {% set ns = namespace(s=bolt_prefix ~ pages[0]) %}
            {% for p in pages[1:] if (ns.s ~ '|' ~ p) | length <= 32 %}{% set ns.s = ns.s ~ '|' ~ p %}{% endfor %}
            {{ ns.s }}
      - action: rest_command.wled_matrix_show
        data:
          fx: "{{ states('sensor.wled_matrix_tempest_fx_id') | int }}"
          name: "{{ wled_text }}"

automation:
  - alias: "WLED Matrix - Update Tempest Weather Display"
    id: wled_matrix_tempest_weather_update
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: state
        entity_id:
          - weather.home
          - sensor.tempest_temperature
          - sensor.tempest_precipitation_rate
          - sensor.tempest_wind_speed
      - trigger: state
        entity_id: sensor.tempest_lightning_strike_distance
        id: lightning_strike
    actions:
      - action: script.wled_matrix_weather
        data:
          strike: "{{ trigger.id == 'lightning_strike' }}"
