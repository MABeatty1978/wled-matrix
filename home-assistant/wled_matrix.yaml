# Home Assistant package: WLED 8x32 matrix at 192.168.87.80
#
# Everything for the matrix lives in this one file:
#   - Tempest Weather display (script + automation)
#   - Scoreboard fed by Team Tracker (template sensor + automation)
#   - rest_command and effect-ID sensors shared by both
#
# Install: copy to /config/packages/ and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
#
# Automations defined here show as read-only in the HA UI; edit this file instead.
#
# Weather entity IDs used below (replace with yours):
#   weather.home, sensor.tempest_temperature, sensor.tempest_humidity,
#   sensor.tempest_wind_speed, sensor.tempest_wind_direction_cardinal,
#   sensor.tempest_precipitation_rate (in/hr), sensor.tempest_lightning_strike_distance (miles)
#
# Scoreboard: shows a game from 1 hour before the start time until 1 hour after it ends,
# then hands the matrix back to the weather display. Home team logo on the left, away team
# on the right. Needs logo packs (sb_<league>.bin) uploaded to WLED. List your Team Tracker
# sensors in the WLED Scoreboard sensor below, highest priority first. When two games
# overlap, a live game wins over an upcoming one, which wins over a finished one; ties go
# to the sensor listed first.


rest_command:
  # Sets the effect and Segment Name text of segment 0 in one request
  wled_matrix_show:
    url: "http://192.168.87.80/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"seg":[{"id":0,"fx":{{ fx | int }},"n":{{ name | string | to_json }}}]}'

# Custom effect IDs are assigned when the firmware boots, so look them up by name
rest:
  - resource: "http://192.168.87.80/json/effects"
    scan_interval: 3600
    sensor:
      - name: "WLED Matrix Tempest FX ID"
        unique_id: wled_matrix_tempest_fx_id
        value_template: "{{ value_json.index('Tempest Weather') if 'Tempest Weather' in value_json else 'unknown' }}"
      - name: "WLED Matrix Scoreboard FX ID"
        unique_id: wled_matrix_scoreboard_fx_id
        value_template: "{{ value_json.index('Scoreboard') if 'Scoreboard' in value_json else 'unknown' }}"

script:
  wled_matrix_weather:
    alias: "WLED Matrix - Show Weather"
    mode: restart
    fields:
      strike:
        description: "True when a nearby lightning strike triggered this update"
        example: false
    sequence:
      # Hold off while the scoreboard owns the matrix
      - condition: template
        value_template: >-
          {{ states('sensor.wled_scoreboard') in ['off', 'unknown', 'unavailable']
             and is_number(states('sensor.wled_matrix_tempest_fx_id')) }}
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: fc
        continue_on_error: true
      - variables:
          daily: "{{ fc['weather.home'].forecast if fc is defined and 'weather.home' in fc else [] }}"

          # 1. Current Temperature, High/Low, and Humidity
          temp_now: "{{ states('sensor.tempest_temperature') | float(60) | round(0) | int }}"
          temp_high: "{{ (daily[0].temperature if daily else temp_now + 5) | round(0) | int }}"
          temp_low: "{{ (daily[0].templow if daily and daily[0].templow is defined else temp_now - 8) | round(0) | int }}"
          humidity: "{{ states('sensor.tempest_humidity') | float(50) | round(0) | int }}"

          # 2. Wind Direction (N, NE, E, SE, S, SW, W, NW) & Speed (mph)
          wind_mph: "{{ states('sensor.tempest_wind_speed') | float(0) | round(0) | int }}"
          wind_dir: "{{ states('sensor.tempest_wind_direction_cardinal') if states('sensor.tempest_wind_direction_cardinal') not in ['unknown', 'unavailable'] else 'NW' }}"

          # 3. Tempest Rain Intensity Level (1=Drizzle .. 5=Downpour)
          rain_rate: "{{ states('sensor.tempest_precipitation_rate') | float(0) }}"
          rain_lvl: >-
            {% if rain_rate < 0.05 %}1
            {% elif rain_rate < 0.15 %}2
            {% elif rain_rate < 0.35 %}3
            {% elif rain_rate < 1.00 %}4
            {% else %}5{% endif %}

          # 4. Map Home Assistant / Tempest Weather Condition to Effect Prefix
          ha_cond: "{{ states('weather.home') }}"
          cond_prefix: >-
            {% if rain_rate > 0 and ha_cond not in ['lightning', 'lightning-rainy', 'snowy'] %}RAIN{{ rain_lvl }}
            {% elif ha_cond in ['lightning', 'lightning-rainy'] %}STORM{{ rain_lvl }}
            {% elif ha_cond in ['pouring'] %}RAIN5
            {% elif ha_cond in ['rainy'] %}RAIN{{ rain_lvl }}
            {% elif ha_cond in ['snowy', 'snowy-rainy', 'hail'] %}SNOW{{ rain_lvl }}
            {% elif ha_cond in ['partlycloudy'] %}{{ 'NIGHTP' if is_state('sun.sun', 'below_horizon') else 'PCLOUD' }}
            {% elif ha_cond in ['cloudy', 'fog'] %}CLOUD
            {% elif ha_cond in ['windy', 'windy-variant'] %}WIND
            {% elif ha_cond in ['clear-night'] %}NIGHT
            {% else %}SUN{% endif %}

          # 5. Real-time Lightning Strike <= 10 miles: "BOLT:<miles> <nonce>|" (the nonce makes repeat strikes re-trigger)
          strike_dist: "{{ states('sensor.tempest_lightning_strike_distance') | float(99) | round(0) | int }}"
          bolt_prefix: "{{ 'BOLT:' ~ strike_dist ~ ' ' ~ now().second ~ '|' if strike | default(false) and strike_dist <= 10 else '' }}"

          # Final Segment Name payload (e.g. "RAIN3:56*F|63/48|NW 14|H 72%").
          # The ESP8266 keeps only 32 characters, so trailing pages are dropped when they won't fit.
          pages: "{{ [cond_prefix ~ ':' ~ temp_now ~ '*F', temp_high ~ '/' ~ temp_low, wind_dir ~ ' ' ~ wind_mph, 'H ' ~ humidity ~ '%'] }}"
          wled_text: >-
            {% set ns = namespace(s=bolt_prefix ~ pages[0]) %}
            {% for p in pages[1:] if (ns.s ~ '|' ~ p) | length <= 32 %}{% set ns.s = ns.s ~ '|' ~ p %}{% endfor %}
            {{ ns.s }}
      - action: rest_command.wled_matrix_show
        data:
          fx: "{{ states('sensor.wled_matrix_tempest_fx_id') | int }}"
          name: "{{ wled_text }}"

template:
  - sensor:
      - name: "WLED Scoreboard"
        unique_id: wled_matrix_scoreboard
        icon: mdi:scoreboard
        # "lg|HOME|AWAY|ST|HS|AS|INFO|POS" (see the Scoreboard effect in firmware/matrix_fx/matrix_fx.cpp), or "off"
        state: >-
          {% set trackers = [
            'sensor.team_tracker_nfl',
            'sensor.team_tracker_ncaaf',
            'sensor.team_tracker_nba',
            'sensor.team_tracker_mlb',
            'sensor.team_tracker_ahl',
          ] %}
          {% set ns = namespace(best=none, rank=0) %}
          {% for e in trackers %}
            {% set o = expand(e) | first | default(none) %}
            {% if o %}
              {% set d = o.attributes.date %}
              {% set start = as_datetime(d) if d else none %}
              {# POST: shown for 1 hour after the state flipped; the start-time check keeps an
                 HA restart from bringing back a game that ended long ago #}
              {% set rank = 3 if o.state == 'IN'
                   else 2 if o.state == 'PRE' and start and now() >= start - timedelta(hours=1)
                   else 1 if o.state == 'POST' and now() - o.last_changed < timedelta(hours=1)
                            and start and now() - start < timedelta(hours=8)
                   else 0 %}
              {% if rank > ns.rank %}{% set ns.best = o %}{% set ns.rank = rank %}{% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.best is none %}off{% else %}
            {% set a = ns.best.attributes %}
            {% set s = ns.best.state %}
            {% set lg = ((a.league if a.league and a.league != 'XXX' else a.league_path) or 'none') | lower %}
            {% set home = a.team_homeaway != 'away' %}
            {% set ha = ((a.team_abbr if home else a.opponent_abbr) or '?') | upper | replace('|', '') %}
            {% set aa = ((a.opponent_abbr if home else a.team_abbr) or '?') | upper | replace('|', '') %}
            {% set hs = (a.team_score if home else a.opponent_score) | int(0) %}
            {% set ascore = (a.opponent_score if home else a.team_score) | int(0) %}
            {% set clock = (a.clock or '') | string %}
            {% set q = a.quarter | int(0) %}
            {% set sport = (a.sport or '') | lower %}
            {% if s == 'PRE' %}
              {% set t = as_local(as_datetime(a.date)) %}
              {% set info = (t.hour % 12 or 12) ~ ':' ~ t.strftime('%M') %}
            {% elif s == 'POST' %}
              {% set info = 'F/OT' if 'OT' in clock else 'F/SO' if 'SO' in clock else 'FINAL' %}
            {% elif 'half' in clock | lower %}
              {% set info = 'HALF' %}
            {% elif sport == 'baseball' %}
              {% set info = clock[:1] | upper ~ (clock | regex_findall_index('\d+') if clock is search('\d') else '') %}
            {% elif sport == 'hockey' %}
              {% set info = 'P' ~ q if q <= 3 else 'OT' if q == 4 else 'SO' %}
            {% elif sport == 'soccer' %}
              {% set info = clock | replace(' ', '') if clock | length <= 5 else (q ~ 'H') %}
            {% elif lg in ['ncaam', 'ncaaw'] %}
              {% set info = 'H' ~ q if q <= 2 else 'OT' %}
            {% else %}
              {% set info = 'Q' ~ q if q <= 4 else 'OT' if q == 5 else (q - 4) ~ 'OT' %}
            {% endif %}
            {% set pos = '' %}
            {% if s == 'IN' and a.possession %}
              {% set mine = a.possession | string == a.team_id | string %}
              {% set theirs = a.possession | string == a.opponent_id | string %}
              {% if mine or theirs %}{% set pos = 'H' if mine == home else 'A' %}{% endif %}
            {% endif %}
            {% set st = {'PRE': 'P', 'IN': 'I', 'POST': 'F'}[s] %}
            {% set parts = [lg, ha, aa, st, hs, ascore, info | upper | replace('|', ''), pos] %}
            {% set out = parts | join('|') %}
            {{ out if out | length <= 32 else (parts[:6] | join('|'))[:32] }}
          {% endif %}

automation:
  - alias: "WLED Matrix - Update Tempest Weather Display"
    id: wled_matrix_tempest_weather_update
    mode: restart
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: state
        entity_id:
          - weather.home
          - sensor.tempest_temperature
          - sensor.tempest_precipitation_rate
          - sensor.tempest_wind_speed
      - trigger: state
        entity_id: sensor.tempest_lightning_strike_distance
        id: lightning_strike
    actions:
      - action: script.wled_matrix_weather
        data:
          strike: "{{ trigger.id == 'lightning_strike' }}"

  - alias: "WLED Matrix - Scoreboard"
    id: wled_matrix_scoreboard_update
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: sensor.wled_scoreboard
      # Re-send during a game in case WLED rebooted or something else changed the effect
      - trigger: time_pattern
        minutes: "/5"
        id: refresh
    conditions:
      - condition: template
        value_template: >-
          {% set board = states('sensor.wled_scoreboard') %}
          {{ board not in ['unknown', 'unavailable'] and not (trigger.id == 'refresh' and board == 'off') }}
    actions:
      - variables:
          board: "{{ states('sensor.wled_scoreboard') }}"
      - if:
          - condition: template
            value_template: "{{ board == 'off' }}"
        then:
          - action: script.wled_matrix_weather
        else:
          - condition: template
            value_template: "{{ is_number(states('sensor.wled_matrix_scoreboard_fx_id')) }}"
          - action: rest_command.wled_matrix_show
            data:
              fx: "{{ states('sensor.wled_matrix_scoreboard_fx_id') | int }}"
              name: "{{ board }}"
